    title: "Sobre o InterChat"
    description: "O InterChat conecta comunidades do Discord por interligação ativa de conversas dos servidores. Mensagens vão naturalmente entre servidores em tempo real, ajudando você a construir uma comunidade engajada em um só tópico."
