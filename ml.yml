hub:
  lock:
    successTitle: ഹബ് ലോക്ക് ചെയ്തു
    successDescription: "**{hub}** വിജയകരമായി ലോക്ക് ചെയ്തു. പുതിയ അംഗങ്ങൾക്ക് ഇനി ചേരാനാകില്ല."
    announceTitle: ഹബ് ലോക്ക് ചെയ്തു
    announceDescription: "ഈ ഹബ് ഒരു മോഡറേറ്റർ ലോക്ക് ചെയ്തിരിക്കുന്നു.\nമോഡറേറ്റർമാർക്ക് മാത്രമേ ഇപ്പോൾ സന്ദേശങ്ങൾ അയക്കാൻ കഴിയൂ."
  unlock:
    successTitle: ഹബ് അൺലോക്ക് ചെയ്തു
    successDescription: "**{hub}** വിജയകരമായി അൺലോക്ക് ചെയ്തു. പുതിയ അംഗങ്ങൾക്ക് ഇപ്പോൾ ചേരാം."
    announceTitle: ഹബ് അൺലോക്ക് ചെയ്തു
    announceDescription: "ഈ ഹബ് ഒരു മോഡറേറ്റർ അൺലോക്ക് ചെയ്തിരിക്കുന്നു.\nനിങ്ങൾക്ക് ഇപ്പോൾ സന്ദേശങ്ങൾ അയക്കാം."
  events:
    serverJoined:
      title: 🎉 പുതിയ സെർവർ ചേർന്നു!
      description: "**{serverName}** ഹബ്ബിൽ ചേർന്നു! നമ്മുടെ കമ്മ്യൂണിറ്റിയിലേക്ക് അവർക്ക് ഊഷ്മളമായ സ്വാഗതം നൽകാം."
      footer: "{hubName}-ലേക്ക് സ്വാഗതം!"
  create:
    title: നിങ്ങളുടെ ഹബ് സൃഷ്ടിക്കുക
    description: ഒരു കമ്മ്യൂണിറ്റിക്കോ, നിങ്ങളുടെ സുഹൃത്തുക്കൾക്കോ... അല്ലെങ്കിൽ ആർക്കെങ്കിലും വേണ്ടി സ്വന്തമായി ഇന്റർചാറ്റ് ഹബ് സൃഷ്ടിക്കുക. മുന്നോട്ട് പോകൂ, അത് എവിടേക്കാണ് പോകുന്നതെന്ന് നോക്കൂ.
  nextSteps:
    created:
      title: ഹബ് വിജയകരമായി സൃഷ്ടിച്ചു!
      description: |
        നിങ്ങളുടെ ഹബ് **{hubName}** തയ്യാറാണ്! അടുത്തതായി നിങ്ങൾക്ക് ചെയ്യാൻ കഴിയുന്നത് ഇതാ:
        - `/invite` ഉപയോഗിച്ച് നിങ്ങളുടെ ആദ്യ സെർവറിനെ ക്ഷണിക്കുക
        - `/rules set` ഉപയോഗിച്ച് നിയമങ്ങൾ സജ്ജമാക്കുക
        - [ഡാഷ്‌ബോർഡിൽ](https://interchat.dev/dashboard) ക്രമീകരണങ്ങൾ ഇഷ്ടാനുസൃതമാക്കുക
        - `/connection add <hub-name>` ഉപയോഗിച്ച് ചാനലുകൾ ബന്ധിപ്പിക്കുക
    inviteLink:
      title: "അടുത്തത്: ഇൻവൈറ്റ് ലിങ്കുകൾ സൃഷ്ടിക്കുക"
      description: "**{hubName}**-നായി ക്ഷണ കോഡുകൾ സൃഷ്ടിക്കാൻ {hubInviteCommand} ഉപയോഗിക്കുക, മറ്റ് സെർവർ ഉടമകളുമായി അവ പങ്കിടുക."
    shareHub:
      title: നിങ്ങളുടെ ഹബ് പങ്കിടുക
      description: "{dot} നിങ്ങളുടെ പുതിയ ഹബ്ബിനെക്കുറിച്ച് ഞങ്ങളുടെ [സപ്പോർട്ട് സെർവറിൽ]({supportInvite}) പോസ്റ്റ് ചെയ്യുക\n{dot} സുഹൃത്തുക്കളുമായും കമ്മ്യൂണിറ്റികളുമായും പങ്കിടുക\n{dot} സോഷ്യൽ മീഡിയ ഉപയോഗിച്ച് പ്രചരിപ്പിക്കുക"
    proTips:
      title: "{dot} പ്രോ ടിപ്പുകൾ"
      description: "{dot} വിപുലമായ ക്രമീകരണങ്ങൾക്കായി [ഡാഷ്‌ബോർഡ്]({website}) സന്ദർശിക്കുക\n{dot} നിങ്ങളുടെ ഹബ് പബ്ലിക് ആക്കാൻ {hubVisibilityCommand} ഉപയോഗിക്കുക\n{dot} സഹായത്തിനും അപ്‌ഡേറ്റുകൾക്കുമായി ഞങ്ങളുടെ [സപ്പോർട്ട് സെർവറിൽ]({supportInvite}) ചേരുക"

  wizard:
    start: നിങ്ങളുടെ ഹബ് സൃഷ്ടിക്കാൻ തുടങ്ങുക
    name:
      label: ഹബ് പേര്
      placeholder: എന്റെ അത്ഭുതകരമായ ഹബ്
    tagline:
      label: ഹബ് ടാഗ്‌ലൈൻ
      placeholder: നിങ്ങളുടെ ഹബ്ബിന്റെ ഒറ്റവരി സംഗ്രഹം
    description:
      label: പൂർണ്ണ വിവരണം
      placeholder: നിങ്ങളുടെ ഹബ് വിശദമായി വിവരിക്കുക (20-1000 അക്ഷരങ്ങൾ)
    steps:
      progress: സ്റ്റെപ്പ് {current}/{total}
      step1:
        modalTitle: "സ്റ്റെപ്പ് 1/7: ഹബ് വിവരങ്ങൾ"
      step2:
        title: ഹബ് ലോഗോ
        description: |
          നിങ്ങളുടെ ഹബ്ബിനായി ഒരു ലോഗോ ചേർക്കുക!

          -# 💡 *ടിപ്പ്: ഒരു ഇമേജ് URL (PNG, JPG, GIF, WEBP) ഉപയോഗിക്കുക അല്ലെങ്കിൽ ഡിഫോൾട്ട് ബോട്ട് അവതാർ തിരഞ്ഞെടുക്കുക.*
        modalTitle: "സ്റ്റെപ്പ് 2/7: ലോഗോ"
        logoUrlLabel: ലോഗോ URL
        logoUrlPlaceholder: https://example.com/logo.png
        addLogoButton: ലോഗോ ചേർക്കുക
        invalidUrl: അസാധുവായ ഇമേജ് URL. പകരം ഡിഫോൾട്ട് ബോട്ട് അവതാർ ഉപയോഗിക്കുന്നു.
      step3:
        description: |
          നിങ്ങളുടെ ഹബ്ബിന്റെ വിസിബിലിറ്റി തിരഞ്ഞെടുക്കുക:

          🔓 **പബ്ലിക്**: ഹബ് ഡയറക്ടറിയിൽ കാണാം, നിയമങ്ങൾ ആവശ്യമാണ്
          👁️ **അൺലിസ്റ്റഡ്**: ഡയറക്ടറിയിൽ ഇല്ല, എന്നാൽ പേര് അറിയാമെങ്കിൽ ആർക്കും ചേരാം
          🔒 **പ്രൈവറ്റ്**: ക്ഷണം വഴി മാത്രം, പൊതുവായി ലിസ്റ്റ് ചെയ്തിട്ടില്ല

          -# 💡 *ടിപ്പ്: നിങ്ങൾക്ക് പിന്നീട് ഹബ് ക്രമീകരണങ്ങളിൽ ഇത് മാറ്റാം.*"
