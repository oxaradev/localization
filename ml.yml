  description: ഇന്റർചാറ്റ് നിങ്ങൾക്ക് അനുയോജ്യമായ രീതിയിൽ പ്രവർത്തിക്കാൻ വ്യക്തിഗത ക്രമീകരണങ്ങൾ എഡിറ്റ് ചെയ്യുക. ഇവ ഗ്ലോബൽ ആണ്, നിങ്ങൾ ഇന്റർചാറ്റുമായി പങ്കിടുന്ന എല്ലാ സെർവറുകളിലും ഇത് ബാധകമാകും.
