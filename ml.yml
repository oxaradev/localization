about:
  title: ഇന്റർചാറ്റിനെക്കുറിച്ച്
  description: |
    InterChat is the all-in-one cross-server chatting provider on Discord! From 1-on-1 “userphone” calls/groupcalls to "always-on" hub spaces managed by you.

    ## What do we offer?
    - **Hubs:** persistent cross-server rooms with AutoMod, granular moderator roles, audit logs, announcements (+ scheduling), public discovery, custom badges, leaderboards, a web dashboard, etc.
    - **Calls:** one-to-one or group bridges with per-server profanity filters
    - **Leaderboards:** compete for top spot across hubs or calls
    - **Moderation tools:** dedicated commands for hub staff & InterChat staff
    - **Modern web dashboard:** manage everything from the browser
    - **Earnable badges:** show off your activity in calls & hubs
    - **Premium:** higher limits & fun perks
    ## Who is InterChat for?
    - The bored and the curious, anyone who wants random, lively conversations.
    - Server owners who want to build lasting bridges (gaming clans, study groups, partnerships, etc.).
    ## Getting Started:
    ### Calls
    Use `/call` to instantly connect your channel with another server.
    ### Hubs
    1. Choose a channel you want linked **at all times**.
    2. Browse `/hub directory` to find a hub you like (they're made by users just like you!).
    3. Click **Join**, you're now connected to all servers in that hub.
      Already know the hub? Use `/hub connect` with its name or invite code.
    ## Useful Links
  closingText: '-# Made with ❤️ by InterChat Development'
  buttons:
    shardInfo: ഷാർഡ് വിവരം
botLanding:
  title: Your server, connected. 🌐 Let's go cross-server!
  description: |
    Hi, I'm InterChat. I connect this server to conversations across Discord.

    ## 📞 1:1 calls and group calls
    Start a call and connect with another server in seconds. Group calls bring several servers into the same conversation.

    Use `/call`, `/skip`, and `/hangup`. Every call can move you up `/leaderboard`. 😎
  hubs: |
    ## 🏡 Hubs
    Hubs are persistent, **cross-server** communities. Connect several servers to one shared space that stays open between conversations.

    - 📌 **Create:** `/hub create` — make your own hub
    - 🧭 **Explore:** `/hub directory` — find public hubs
    - 🔗 **Connect:** `/hub connect` — join an existing hub
    - ⚙️ **Manage:** `/hub manage` — open your hub settings
    > Use `/help` to see every command.
  closing: |
    **Ready to meet another server? Try a call, discover a hub, or create your own below.**

    -# Made with ❤️ by InterChat Development
