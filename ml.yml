report:
  title: റിപ്പോർട്ട് സന്ദേശം
  footer: ഇന്റർചാറ്റ് എല്ലാവർക്കും സുരക്ഷിതമായി നിലനിർത്താൻ റിപ്പോർട്ടുകൾ സഹായിക്കുന്നു
  description: "ഹബ് ലംഘനങ്ങൾക്ക് {user}-നെ **ഹബ് സ്റ്റാഫിനോ** പ്ലാറ്റ്‌ഫോം ലംഘനങ്ങൾക്ക് **ഇന്റർചാറ്റ് സ്റ്റാഫിനോ** റിപ്പോർട്ട് ചെയ്യുക. ഉപയോക്താവിനെ അറിയിക്കില്ല, പക്ഷേ ആരാണ് റിപ്പോർട്ട് സമർപ്പിച്ചതെന്ന് മോഡറേറ്റർമാർക്ക് കാണാൻ കഴിയും."
  contextMenu: റിപ്പോർട്ട് സന്ദേശം
  buttons:
    toStaff: സ്റ്റാഫിനെ അറിയിക്കുക
    toHub: ഹബ്ബിനെ അറിയിക്കുക
  modal:
    toStaff:
      title: ഇന്റർചാറ്റ് സ്റ്റാഫിന് റിപ്പോർട്ട് ചെയ്യുക
    toHub:
      title: ഹബ് മോഡറേറ്റർമാർക്ക് റിപ്പോർട്ട് ചെയ്യുക
    reason:
      label: റിപ്പോർട്ടിനുള്ള കാരണം
      placeholder: എന്തുകൊണ്ടാണ് നിങ്ങൾ ഈ സന്ദേശം റിപ്പോർട്ട് ചെയ്യുന്നതെന്ന് വിവരിക്കുക...
  status:
    resolvedBy: "{name} പരിഹരിച്ചു"
    ignoredBy: "{name} അവഗണിച്ചു"
  success:
    title: റിപ്പോർട്ട് സമർപ്പിച്ചു
    toStaff: "{tick} നിങ്ങളുടെ റിപ്പോർട്ട് ഇന്റർചാറ്റ് സ്റ്റാഫിന് അവലോകനത്തിനായി അയച്ചു."
    toHub: "{tick} നിങ്ങളുടെ റിപ്പോർട്ട് അവലോകനത്തിനായി ഹബ് മോഡറേറ്റർമാർക്ക് അയച്ചു."
    actionPast: റിപ്പോർട്ട് {action}.
  dm:
    resolved: "നിങ്ങളുടെ റിപ്പോർട്ടിന് നന്ദി. ഞങ്ങളുടെ മോഡറേഷൻ ടീം അത് അവലോകനം ചെയ്ത് ഉചിതമായ നടപടി സ്വീകരിച്ചു. ഉപയോക്തൃ സ്വകാര്യത സംരക്ഷിക്കുന്നതിന് ഞങ്ങൾക്ക് നിർദ്ദിഷ്ട വിശദാംശങ്ങൾ പങ്കിടാൻ കഴിയില്ല."
  errors:
    hubMessageOnly: "{x_icon} ഇന്റർചാറ്റ് ഹബ്ബുകൾ വഴി മാത്രമേ നിങ്ങൾക്ക് സന്ദേശങ്ങൾ റിപ്പോർട്ട് ചെയ്യാൻ കഴിയൂ."
    cannotReportSelf: "{x_icon} നിങ്ങളുടെ സ്വന്തം സന്ദേശങ്ങൾ റിപ്പോർട്ട് ചെയ്യാൻ കഴിയില്ല."
    processingFailed: റിപ്പോർട്ട് പ്രോസസ്സ് ചെയ്യുന്നതിൽ ഒരു പിശക് നേരിട്ടു! ദയവായി പിന്നീട് വീണ്ടും ശ്രമിക്കുക.
    notFoundOrDeleted: റിപ്പോർട്ട് കണ്ടെത്തിയില്ല അല്ലെങ്കിൽ ഇല്ലാതാക്കി.
    alreadyHandled: ഈ റിപ്പോർട്ട് ഇതിനകം {status} ആണ്.
    updateFailed: റിപ്പോർട്ട് അപ്ഡേറ്റ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു. പിന്നീട് വീണ്ടും ശ്രമിക്കുക.

