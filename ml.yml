      nextSteps: അടുത്തത് എന്താണ്?
      step1: |
        **പ്രൈവറ്റ് ഹബ്ബുകൾക്ക്: ഒരു ഇൻവൈറ്റ് സൃഷ്ടിക്കുക**: `/hub invites hub:{hubName}`
        *നിങ്ങളുടെ ഹബ്ബിൽ ചേരാൻ സെർവറുകളെ ക്ഷണിക്കുക*

        **പബ്ലിക് ഹബ്ബുകൾക്ക്: നിങ്ങളുടെ ഹബ് പങ്കിടുക**: നിങ്ങളുടെ ഹബ്ബിന്റെ [പബ്ലിക് പേജ്](https://interchat.dev/hubs/{hubId}) പരിശോധിച്ച് ചേരാൻ ലിങ്ക് ഉപയോഗിക്കുക!
        *നിങ്ങളുടെ ഹബ് മറ്റുള്ളവരുമായി പങ്കിടുക അല്ലെങ്കിൽ ഇവിടെ നിന്ന് ചേരുക!*
      step2: "**വിപുലമായ ക്രമീകരണങ്ങൾ**: `/hub configure {hubName}`\n   - അശ്ലീല ഫിൽട്ടറുകൾ (കസ്റ്റം ആന്റി-സ്വെയർ നിയമങ്ങൾ)\n   - ഹബ് ടീം മാനേജ്‌മെന്റ്\n   - വിപുലമായ ലോഗിംഗ് ഓപ്ഷനുകൾ\n   - ഹബ് അറിയിപ്പുകൾ"
      step3: "**സഹായം ആവശ്യമുണ്ടോ?**: [ഞങ്ങളുടെ സപ്പോർട്ട് സെർവറിൽ ചേരുക]({supportInvite})"
    cancelled:
