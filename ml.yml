about:
  title: ഇന്റർചാറ്റിനെക്കുറിച്ച്
  description: InterChat connects Discord communities through active cross-server discussions. Messages flow naturally between servers in real-time.
  supportText: സഹായം ആവശ്യമുണ്ടോ? സഹായത്തിനായി ഞങ്ങളുടെ പിന്തുണ സെർവറിൽ ചേരൂ!
  features:
    title: ഫീച്ചറുകൾ
    list: |
      - Connect with other servers for active cross-server discussions
      - Messages flow naturally between servers in real-time
      - Build engaged topic-focused communities
      - Moderation tools to keep discussions healthy
      - Visual dashboard to manage your hubs, servers, and settings
  buttons:
    shardInfo: ഷാർഡ് വിവരം
botLanding:
  title: "👋 ഹേയ്!"
  description: "**I'm InterChat, and I'm pleased to be on your server.**\n\nReady to start building new bridges?\n\n{dot} **New here?** The `/setup` command provides a step-by-step guide.\n{dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs)."
setup:
  welcome:
    title: ഇന്റർചാറ്റ് സജ്ജീകരണത്തിലേക്ക് സ്വാഗതം
    description: നിങ്ങളുടെ സെർവറുമായി ബന്ധിപ്പിക്കാം. ഒരു ഹബ് സൃഷ്ടിക്കുന്നതിനോ ചേരുന്നതിനോ ഈ വിസാർഡ് നിങ്ങളെ നയിക്കും.
  select:
    placeholder: ഒരു ഭാഷ തിരഞ്ഞെടുക്കുക
  locale:
    successDescription: "{tick} നിങ്ങളുടെ ഭാഷ ഇതായി സജ്ജീകരിച്ചിരിക്കുന്നു **{locale_name}**"
  join:
    title: ഒരു ഹബ്ബിൽ ചേരുക
    description: പബ്ലിക് ഡയറക്ടറി ഉപയോഗിക്കുകയോ ഒരു ക്ഷണ കോഡ് ഉപയോഗിച്ച് ബന്ധിപ്പിക്കുകയോ ചെയ്യുക.
    publicHubs:
      title: പൊതു ഹബ്ബുകൾ (Public)
      description: "**Browse** [interchat.dev/hubs](https://interchat.dev/hubs)"
    privateHubs:
      title: സ്വകാര്യം അല്ലെങ്കിൽ ക്ഷണം മാത്രം
      description: "**Ask the hub owner** for an invite code or run `/connection add`"
    footer: You can join more hubs anytime.
  buttons:
    startWizard: സജ്ജീകരണ വിസാർഡ് ആരംഭിക്കുക
    createHub: ഹബ് സൃഷ്ടിക്കുക
    discoverHubs: പബ്ലിക് ഹബ്ബുകൾ കണ്ടെത്തുക
    useDefault: ഡിഫോൾട്ട് ഉപയോഗിക്കുക
    skipForNow: തൽക്കാലം ഒഴിവാക്കുക
  errors:
    wizardOwnerOnly: "{x_icon} You can't use this setup wizard."
  footer: "InterChat Setup • {guildName}"
