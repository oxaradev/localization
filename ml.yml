        title: കമ്മ്യൂണിറ്റി നിയമങ്ങൾ
        description: നിങ്ങളുടെ ഹബ്ബിനായി കമ്മ്യൂണിറ്റി മാർഗ്ഗനിർദ്ദേശങ്ങൾ സജ്ജമാക്കുക.
        requiredPublic: "**പബ്ലിക് ഹബ്ബുകൾക്ക് നിർബന്ധമാണ്**"
        optional: ഓപ്ഷണൽ
        tip: "-# 💡 *ടിപ്പ്: ഓരോ വരിയിലും ഒരു നിയമം ചേർക്കുക. നിങ്ങൾക്ക് 25 നിയമങ്ങൾ വരെ ചേർക്കാം.*"
        modalTitle: "സ്റ്റെപ്പ് 4/7: നിയമങ്ങൾ"
        rulesLabel: ഹബ് നിയമങ്ങൾ
        rulesPlaceholder: "1. ബഹുമാനത്തോടെ പെരുമാറുക\n2. സ്പാം പാടില്ല\n3. Discord ToS പാലിക്കുക"
        addRulesButton: നിയമങ്ങൾ ചേർക്കുക
      step5:
        title: സ്വാഗത സന്ദേശം
        description: |
          പുതിയ അംഗങ്ങൾക്കായി ഒരു സ്വാഗത സന്ദേശം സൃഷ്ടിക്കുക!

          -# 💡 *ടിപ്പ്: ഇത് സൗഹൃദപരവും വിജ്ഞാനപ്രദവുമായി സൂക്ഷിക്കുക. പരമാവധി 500 അക്ഷരങ്ങൾ.*"
        modalTitle: "സ്റ്റെപ്പ് 5/7: സ്വാഗതം"
        welcomePlaceholder: "{hubName}-ലേക്ക് അല്ലെങ്കിൽ ഞങ്ങളുടെ ഹബ്ബിലേക്ക് സ്വാഗതം! ദയവായി നിയമങ്ങൾ വായിച്ച് ആസ്വദിക്കൂ!"
        customMessageButton: കസ്റ്റം മെസ്സേജ്
      step6:
        title: ഹബ് ഫീച്ചറുകൾ
        description: |
          നിങ്ങളുടെ ഹബ്ബിനായി ഫീച്ചറുകൾ തിരഞ്ഞെടുക്കുക!
          ✅ **മുൻകൂട്ടി തിരഞ്ഞെടുത്തത്**: റിയാക്ഷനുകൾ, സ്പാം ഫിൽട്ടർ (ശുപാർശ ചെയ്യുന്നത്)

          -# 💡 *ടിപ്പ്: നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും `/hub configure`-ൽ ഇവ ക്രമീകരിക്കാം.*"
        modulesPlaceholder: എനേബിൾ ചെയ്യാൻ മൊഡ്യൂളുകൾ തിരഞ്ഞെടുക്കുക...
        continueButton: തുടരുക
      step7:
        description: |
          മോഡറേഷൻ ലോഗുകൾക്കായി ഓപ്ഷണലായി ഒരു ചാനൽ തിരഞ്ഞെടുക്കുക.
          ലോഗുകളിൽ ഉൾപ്പെടുന്നവ: ബാനുകൾ, മുന്നറിയിപ്പുകൾ, റിപ്പോർട്ടുകൾ, മറ്റ് മോഡ് പ്രവർത്തനങ്ങൾ.

