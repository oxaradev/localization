about:
  title: ഇന്റർചാറ്റിനെക്കുറിച്ച്
  description: "ഇന്റർചാറ്റ് സജീവമായ ക്രോസ്-സെർവർ ചർച്ചകളിലൂടെ ഡിസ്‌കോർഡ് കമ്മ്യൂണിറ്റികളെ ബന്ധിപ്പിക്കുന്നു. സന്ദേശങ്ങൾ തത്സമയം സെർവറുകൾക്കിടയിൽ സ്വാഭാവികമായി ഒഴുകുന്നു, ഇത് ഇടപഴകുന്ന വിഷയാധിഷ്ഠിത കമ്മ്യൂണിറ്റികൾ നിർമ്മിക്കാൻ നിങ്ങളെ സഹായിക്കുന്നു."
  supportText: സഹായം ആവശ്യമുണ്ടോ? സഹായത്തിനായി ഞങ്ങളുടെ പിന്തുണ സെർവറിൽ ചേരൂ!
  features:
    title: ഫീച്ചറുകൾ
    list: |
      - സജീവമായ ക്രോസ്-സെർവർ ചർച്ചകൾക്കായി മറ്റ് സെർവറുകളുമായി കണക്റ്റുചെയ്യുക
      - സന്ദേശങ്ങൾ തത്സമയം സെർവറുകൾക്കിടയിൽ സ്വാഭാവികമായി ഒഴുകുന്നു
      - ഇടപഴകുന്ന വിഷയാധിഷ്ഠിത കമ്മ്യൂണിറ്റികൾ നിർമ്മിക്കുക
      - ചർച്ചകൾ ആരോഗ്യകരമായി നിലനിർത്തുന്നതിനുള്ള മോഡറേഷൻ ഉപകരണങ്ങൾ
      - നിങ്ങളുടെ ഹബുകൾ, സെർവറുകൾ, ക്രമീകരണങ്ങൾ എന്നിവ കൈകാര്യം ചെയ്യുന്നതിനുള്ള വിഷ്വൽ ഡാഷ്‌ബോർഡ്
  buttons:
    vote: Top.gg-ൽ വോട്ട് ചെയ്യുക
    invite: ഇന്റർചാറ്റിനെ ക്ഷണിക്കുക
    dashboard: ഡാഷ്‌ബോർഡ് തുറക്കുക
    support: പിന്തുണയിൽ ചേരുക
    shardInfo: ഷാർഡ് വിവരം

botLanding:
  title: 👋 ഹേയ്!
  description: |
    **ഞാൻ ഇന്റർചാറ്റ് ആണ്, ഞങ്ങളുടെ ടീമിനുവേണ്ടി നിങ്ങളുടെ സെർവറിൽ ഉണ്ടായിരിക്കുന്നതിൽ എനിക്ക് സന്തോഷമുണ്ട്.**
    ഒന്നിച്ചുചേർന്ന്, ഡിസ്‌കോർഡിൽ ഉടനീളമുള്ള മറ്റ് ശ്രദ്ധേയമായ കമ്മ്യൂണിറ്റികളുമായി നിങ്ങളുടെ സെർവറിനെ ബന്ധിപ്പിക്കാൻ ഞങ്ങൾക്ക് കഴിയും. നിങ്ങളുമായി സംഭാഷണത്തിൽ ഏർപ്പെടാൻ ആഗ്രഹിക്കുന്ന വ്യക്തികളാൽ നിറഞ്ഞിരിക്കുന്ന നിരവധി, ആയിരക്കണക്കിന് സെർവറുകൾ ഒരിടത്ത് സ്ഥിതിചെയ്യുന്നു. 🚀

    **ഞങ്ങളുമായി പുതിയ പാലങ്ങൾ നിർമ്മിക്കാൻ തയ്യാറാണോ?**
    {dot} **ഇവിടെ പുതിയയാളാണോ?** `/setup` കമാൻഡ് നിങ്ങളുടെ യാത്ര ആരംഭിക്കാൻ നിങ്ങളെ സഹായിക്കുന്നതിന് ഒരു ഘട്ടം ഘട്ടമായുള്ള ഗൈഡ് നൽകുന്നു.
    {dot} **പര്യവേക്ഷണം ചെയ്യാൻ തയ്യാറാണോ?** ഞങ്ങളുടെ [കണ്ടെത്തൽ പേജ്](https://interchat.dev/hubs) സന്ദർശിക്കുക, ഞങ്ങളുടെ സജീവമായ ഹബ്ബുകൾ കണ്ടെത്താനും അവയുടെ ഭാഗമാകാനും.

    💝 **വഴിതെറ്റിയോ? സഹായം ആവശ്യമുണ്ടോ?** ഞങ്ങളുടെ [പിന്തുണ കമ്മ്യൂണിറ്റി](https://discord.gg/8DhUA4HNpD) ലേക്ക് ഞങ്ങൾ നിങ്ങളെ സ്വാഗതം ചെയ്യുന്നു. ഞങ്ങളുടെ ടീമും സമൂഹവും സഹായം വാഗ്ദാനം ചെയ്യുന്നതിൽ സന്തോഷിക്കും. നിങ്ങൾക്ക് എന്ത് പ്രശ്‌നങ്ങളുണ്ടെങ്കിലും, മടിക്കാതെ ചേരൂ!

