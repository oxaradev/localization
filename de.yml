about:
  title: "Über InterChat"
  description: "InterChat verbindet Discord-Communities durch aktive serverübergreifende Diskussionen. Nachrichten fließen in Echtzeit ganz natürlich zwischen Servern und helfen dir, engagierte themenbezogene Communities aufzubauen."
  supportText: "Brauchst du Hilfe? Tritt unserem Support-Server bei!"
  features:
    title: "Funktionen"
    list: |
      - Verbinde dich mit anderen Servern für aktive serverübergreifende Diskussionen
      - Nachrichten fließen natürlich und in Echtzeit zwischen Servern
      - Baue engagierte themenbezogene Communities auf
      - Moderationstools, um Diskussionen gesund zu halten
      - Visuelles Dashboard zur Verwaltung deiner Hubs, Server und Einstellungen
  buttons:
    vote: "Auf top.gg voten"
    invite: "InterChat einladen"
    dashboard: "Dashboard öffnen"
    support: "Support beitreten"
    shardInfo: "Shard Info"

botLanding:
  title: "👋 Hey da!"
  description: |
    **Ich bin InterChat und freue mich, im Namen unseres Teams auf deinem Server zu sein.**
    Zusammen können wir deinen Server mit anderen bemerkenswerten Communities auf ganz Discord verbinden. Zahlreiche, potenziell tausende Server an einem Ort, gefüllt mit Menschen, die sich darauf freuen, mit dir ins Gespräch zu kommen. 🚀

    **Bereit, neue Brücken mit uns zu bauen?**
    {dot} **Neu hier?** Der `/setup` Befehl bietet eine Schritt-für-Schritt-Anleitung, um deine Reise zu beginnen.
    {dot} **Bereit zum Erkunden?** Besuche unsere [Entdeckungsseite](https://interchat.dev/hubs), um unsere lebhaften Hubs zu finden und Teil von ihnen zu werden.

    💝 **Verloren? Brauchst du Hilfe?** Wir heißen dich in unserer [Support-Community](https://discord.gg/8DhUA4HNpD) willkommen. Unser Team und unsere Community helfen dir gerne weiter. Wir bieten Unterstützung bei allen Problemen, zögere nicht beizutreten!

