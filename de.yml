about:
  title: Über InterChat
  description: InterChat verbindet Discord-Communities durch aktive serverübergreifende Diskussionen. Nachrichten fließen in Echtzeit ganz natürlich zwischen Servern und helfen dir, engagierte themenbezogene Communities aufzubauen.
  supportText: Brauchst du Hilfe? Tritt unserem Support-Server bei!
  features:
    title: Funktionen
    list: '- Connect with other servers for active cross-server discussions - Messages flow naturally between servers in real-time - Build engaged topic-focused communities - Moderation tools to keep discussions healthy - Visual dashboard to manage your hubs, servers, and settings '
  buttons:
    shardInfo: Shard Info
botLanding:
  title: '👋 Hey da!'
  description: '**I''m InterChat, and I''m pleased to be on your server on behalf of our team.** Together, we can connect your server with other remarkable communities from across Discord. Numerous, potentially thousands of servers located in one place, all filled with individuals eager to engage in conversation with you. 🚀 **Ready to start building new bridges with us?** {dot} **New here?** The `/setup` command provides a step-by-step guide to help you begin your journey. {dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs) to locate and become part of our lively hubs. 💝 **Lost? Require assistance?** We welcome you to our [support community](https://discord.gg/8DhUA4HNpD). Our team and our community will be pleased to offer their help. We offer as much support and assistance in whatever issues you may have, don''t hesitate to join! '
setup:
  welcome:
    title: Willkommen beim InterChat Setup
    description: Lass uns deinen Server verbinden. Dieser Assistent führt dich durch das Erstellen oder Beitreten eines Hubs.
  select:
    placeholder: Wähle eine Sprache
  locale:
    successDescription: '{tick} Deine Sprache wurde auf **{locale_name}** gesetzt'
  join:
    title: Einem Hub beitreten
    description: Nutze das öffentliche Verzeichnis oder verbinde dich mit einem Einladungscode.
    publicHubs:
      title: Öffentliche Hubs
      description: '**Browse** [interchat.dev/hubs](https://interchat.dev/hubs) **Or click** the button below to open the directory'
    privateHubs:
      title: Privat oder nur auf Einladung
      description: '**Ask the hub owner or manager** for an invite code **Run `/connection add <invite-code>`** in your server to join'
    footer: Du kannst jederzeit weiteren Hubs beitreten und gleichzeitig in verschiedenen Kanälen mit mehreren Hubs verbunden sein.
  buttons:
    startWizard: Setup-Assistent starten
    createHub: Hub erstellen
    discoverHubs: Öffentliche Hubs entdecken
    joinHub: Hub beitreten
    useDefault: Standard verwenden
    skipForNow: Vorerst überspringen
