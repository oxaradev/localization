about:
  title: Tentang InterChat
  description: InterChat connects Discord communities through active cross-server discussions. Messages flow naturally between servers in real-time.
  supportText: Butuh bantuan? Bergabunglah dengan server support kami untuk bantuan!
  features:
    title: Fitur
    list: |
      - Connect with other servers for active cross-server discussions
      - Messages flow naturally between servers in real-time
      - Build engaged topic-focused communities
      - Moderation tools to keep discussions healthy
      - Visual dashboard to manage your hubs, servers, and settings
  buttons:
    shardInfo: Info Shard
botLanding:
  title: "👋 Halo!"
  description: "**I'm InterChat, and I'm pleased to be on your server.**\n\nReady to start building new bridges?\n\n{dot} **New here?** The `/setup` command provides a step-by-step guide.\n{dot} **Ready to explore?** Visit our [discovery page](https://interchat.fun/hubs)."
