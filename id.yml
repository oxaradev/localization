about:
  title: "Tentang InterChat"
  description: "InterChat menghubungkan komunitas Discord melalui diskusi lintas-server yang aktif. Pesan mengalir secara alami antar server secara real-time, membantu Anda membangun komunitas berbasis topik yang aktif."
  supportText: "Butuh bantuan? Bergabunglah dengan server support kami untuk bantuan!"
  features:
    title: "Fitur"
    list: |
      - Terhubung dengan server lain untuk diskusi lintas-server yang aktif
      - Pesan mengalir secara alami antar server secara real-time
      - Bangun komunitas berbasis topik yang aktif
      - Alat moderasi untuk menjaga diskusi tetap sehat
      - Dasbor visual untuk mengelola hub, server, dan pengaturan Anda
  buttons:
    vote: "Vote di top.gg"
    invite: "Undang InterChat"
    dashboard: "Buka Dasbor"
    support: "Gabung Support"
    shardInfo: "Info Shard"

botLanding:
  title: "👋 Halo!"
  description: |
    **Saya InterChat, dan saya senang berada di server Anda mewakili tim kami.**
    Bersama-sama, kita dapat menghubungkan server Anda dengan komunitas luar biasa lainnya dari seluruh Discord. Banyak, berpotensi ribuan server yang terletak di satu tempat, semuanya dipenuhi dengan individu yang ingin terlibat dalam percakapan dengan Anda. 🚀

    **Siap mulai membangun jembatan baru bersama kami?**
    {dot} **Baru di sini?** Perintah `/setup` menyediakan panduan langkah demi langkah untuk membantu Anda memulai perjalanan.
    {dot} **Siap menjelajah?** Kunjungi [halaman penemuan](https://interchat.dev/hubs) kami untuk mencari dan menjadi bagian dari hub kami yang hidup.

    💝 **Tersesat? Butuh bantuan?** Kami menyambut Anda di [komunitas support](https://discord.gg/8DhUA4HNpD) kami. Tim kami dan komunitas kami akan dengan senang hati menawarkan bantuan mereka. Kami menawarkan dukungan dan bantuan sebanyak mungkin dalam masalah apa pun yang mungkin Anda miliki, jangan ragu untuk bergabung!

