  about:
    title: Sobre InterChat
    description:
      InterChat conecta las comunidades de Discord a través de una discusión activa entre servidores. Los mensajes
      fluyen naturalmente entre servidores en tiempo real, ayudándote a construir comunidades comprometidas y centradas en
      temas.
    supportText: ¿Necesitas ayuda? ¡Únete a nuestro servidor de soporte para asistencia!
    features:
      title: Características
      list:
        "- Conéctate con otros servidores para discusiones activas entre servidores

        - Mensajes que fluyen naturalmente entre servidores en tiempo real

        - Construye comunidades comprometidas y centradas en temas

        - Herramientas de moderación para mantener discusiones saludables

        - Panel visual para manejar tus centros, servidores y configuraciones

        "
    buttons:
      vote: Vota en top.gg
      invite: Invita a Interchat
      dashboard: Abre el panel
      support: Únete al soporte
      shardInfo: Información de fragmentos
  botLanding:
    title: 👋 ¡Hola!
    description:
      "**Soy InterChat, y me complace estar en tu servidor en nombre de nuestro equipo.**

      Juntos podemos conectar tu servidor con otras comunidades notables de Discord. Numerosos, potencialmente miles de servidores
      ubicados en un solo lugar, todos llenos de individuos ansiosos por conversar contigo. 🚀


      **¿Listo para comenzar a construir nuevos puentes con nosotros?**

      {dot} **¿Nuevo aquí?** El comando `/setup` proporciona una guía paso a paso para comenzar tu journey.

      {dot} **¿Listo para explorar?** Visita nuestra [página de descubrimiento](https://interchat.dev/hubs) para ubicar y
      unirte a nuestros hubs activos.

      {dot} **¿Tal vez algo más familiar?** Prueba nuestro `/call` para conexiones uno a uno.


      💝 **¿Perdido? ¿Necesitas ayuda?** Te damos la bienvenida a nuestra [comunidad de soporte](https://discord.gg/8DhUA4HNpD).
      Nuestro equipo y comunidad estarán encantados de ayudarte. Ofrecemos todo el soporte y asistencia que necesites, ¡no
      dudes en unirte!

      "
