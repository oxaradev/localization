  about:
    title: "Sobre InterChat"
    description: "InterChat conecta comunidades de Discord a través de discusiones activas entre servidores. Los mensajes fluyen naturalmente entre servidores en tiempo real, ayudándote a construir comunidades comprometidas y enfocadas en temas."
    supportText: "¿Necesitas ayuda? ¡Únete a nuestro servidor de soporte para asistencia!"
    features:
      title: "Características"
      list: |
        - Conecta con otros servidores para discusiones activas cruzadas
        - Los mensajes fluyen naturalmente entre servidores en tiempo real
        - Construye comunidades comprometidas y enfocadas en temas
        - Herramientas de moderación para mantener las discusiones sanas
        - Dashboard visual para gestionar tus Hubs, servidores y configuraciones
    buttons:
      vote: "Votar en top.gg"
      invite: "Invitar a InterChat"
      dashboard: "Abrir Dashboard"
      support: "Unirse al Soporte"
      shardInfo: "Info del Shard"

  # Bot Greeting (New Server Join)
  botLanding:
    title: "👋 ¡Hola!"
    description: |
      **Soy InterChat, y es un placer estar en tu servidor en nombre de nuestro equipo.**
      Juntos, podemos conectar tu servidor con otras comunidades notables de todo Discord. Numerosos, potencialmente miles de servidores ubicados en un solo lugar, todos llenos de individuos ansiosos por conversar contigo. 🚀

      **¿Listo para comenzar a construir nuevos puentes con nosotros?**
      {dot} **¿Nuevo aquí?** El comando `/setup` proporciona una guía paso a paso para ayudarte a comenzar tu viaje.
      {dot} **¿Listo para explorar?** Visita nuestra [página de descubrimiento](https://interchat.dev/hubs) para localizar y formar parte de nuestros animados Hubs.

      💝 **¿Perdido? ¿Necesitas asistencia?** Te damos la bienvenida a nuestra [comunidad de soporte](https://discord.gg/8DhUA4HNpD). Nuestro equipo y comunidad estarán encantados de ofrecer su ayuda. Ofrecemos tanto soporte y asistencia como necesites en cualquier problema que puedas tener, ¡no dudes en unirte!

