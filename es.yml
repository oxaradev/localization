about:
  title: Sobre InterChat
  description: InterChat conecta a comunidades a través de discusiones entre servidores. Los mensajes fluyen naturalmente entre servidores en tiempo real.
  supportText: '¿Necesitas ayuda? ¡Únete a nuestro servidor de soporte para asistencia!'
  features:
    title: Características
    list: |
      - Conecta con otros servidores para discusiones proactivas entre servidores
      - Los mensajes fluyen naturalmente entre los servidores en tiempo real
      - Construye comunidades basadas en tópicos específicos
      - Herramientas de moderación para mantener discusiones sanas
      - Un dashboard visual para gestionar tus hubs, servidores, y ajustes
  gettingStarted:
    title: Antes de Empezar
    steps: |
      - Ejecuta `/setup` para conectarte
      - Busca hubs públicos con `/hub discover`
      - Únete a un hub en un canal con `/connection add hub:<nombre>`
      - Únete a un hub privado con `/connection add invite:<código>`
  buttons:
    shardInfo: Info del Shard
botLanding:
  title: Welcome to InterChat! 🌐
  description: |
    Thank you for inviting InterChat. You now have 13,000+ Discord servers worldwide to chat with at your fingertips!
    ## What is InterChat?

    InterChat is the largest cross-server communication bot on Discord. Chat with people from thousands of communities, without anyone leaving their server. We offer two ways to connect:
  hubs: |
    ## ⭐ Hubs — Always-On Communities
    Connect a channel to a Hub and chat with hundreds of servers at once. The connection stays active 24/7, creating a permanent portal between communities.

    ✦ Strict 24/7 moderation
    ✦ Active topic-based channels
    ✦ Best for long-term engagement

    Use `/connection add` to get started
  calls: |
    ## 📞 Calls & Group Calls — Instant Cross-Server Calls
     Start a live conversation with up to 5 servers simultaneously. No invites, no setup. Instant connection.

     ✦ 1:1 Calls
     ✦ Group calls with up to 4 servers per call
     ✦ Built-in moderation tools
     ✦ Perfect for events & quick chats

     Use `/call` to get started
  closing: |
    ## Trusted by communities across Discord
    InterChat powers real-time conversations across 13,000+ servers. Join the network and connect with communities worldwide!

    -# Made with ❤️ by the InterChat Team
