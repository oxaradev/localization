about:
  title: Na temat InterChat
  description:
    InterChat connects Discord communities through active cross-server discussions. Messages flow naturally between
    servers in real-time, helping you build engaged topic-focused communities.
  supportText: Potrzebujesz pomocy? Dołącz do naszego serwera wsparcia, aby uzyskać pomoc!
  features:
    title: Features
    list: "- Connect with other servers for active cross-server discussions

      - Messages flow naturally between servers in real-time

      - Build engaged topic-focused communities

      - Moderation tools to keep discussions healthy

      - Visual dashboard to manage your hubs, servers, and settings

      "
  buttons:
    vote: Głosuj na top.gg
    invite: Zaproś InterChat
    dashboard: Open Dashboard
    support: Dołącz do wsparcia
    shardInfo: Shard Info
botLanding:
  title: 👋 Hey there!
  description:
    "**I'm InterChat, and I'm pleased to be on your server on behalf of our team.**

    Together, we can connect your server with other remarkable communities from across Discord. Numerous, potentially thousands
    of servers located in one place, all filled with individuals eager to engage in conversation with you. 🚀


    **Ready to start building new bridges with us?**

    {dot} **New here?** The `/setup` command provides a step-by-step guide to help you begin your journey.

    {dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs) to locate and become part of our
    lively hubs.

    {dot} **Perhaps something you're more familiar with?** Try our `/call` for one on one connections.


    💝 **Lost? Require assistance?** We welcome you to our [support community](https://discord.gg/8DhUA4HNpD). Our team and
    our community will be pleased to offer their help. We offer as much support and assistance in whatever issues you may
    have, don't hesitate to join!

    "
