about:
  title: "เกี่ยวกับ InterChat"
  description: "InterChat เชื่อมต่อชุมชน Discord ผ่านการสนทนาข้ามเซิร์ฟเวอร์ที่ใช้งานอยู่จริง ข้อความจะไหลเวียนระหว่างเซิร์ฟเวอร์อย่างเป็นธรรมชาติแบบเรียลไทม์ ช่วยให้คุณสร้างชุมชนที่เน้นหัวข้อสนทนาได้อย่างมีส่วนร่วม"
  supportText: "ต้องการความช่วยเหลือ? เข้าร่วมเซิร์ฟเวอร์สนับสนุนของเราเพื่อรับความช่วยเหลือ!"
  features:
    title: "ฟีเจอร์"
    list: |
      - เชื่อมต่อกับเซิร์ฟเวอร์อื่นๆ เพื่อการสนทนาข้ามเซิร์ฟเวอร์ที่คึกคัก
      - ข้อความไหลเวียนระหว่างเซิร์ฟเวอร์อย่างเป็นธรรมชาติแบบเรียลไทม์
      - สร้างชุมชนที่เน้นหัวข้อสนทนาและมีส่วนร่วมสูง
      - เครื่องมือ Moderation เพื่อรักษาบรรยากาศการสนทนาที่ดี
      - แดชบอร์ดแบบภาพเพื่อจัดการ Hubs, เซิร์ฟเวอร์ และการตั้งค่าของคุณ
  buttons:
    vote: "โหวตบน top.gg"
    invite: "เชิญ InterChat"
    dashboard: "เปิดแดชบอร์ด"
    support: "เข้าร่วม Support"
    shardInfo: "ข้อมูล Shard"
botLanding:
  title: "👋 สวัสดีครับ!"
  description: |
    **ฉันคือ InterChat และฉันยินดีที่ได้มาอยู่ที่เซิร์ฟเวอร์ของคุณในนามของทีมงานของเรา**
    เราจะช่วยเชื่อมต่อเซิร์ฟเวอร์ของคุณกับชุมชนที่น่าทึ่งอื่นๆ จากทั่วทั้ง Discord ร่วมกัน มีเซิร์ฟเวอร์มากมาย อาจถึงหลักพัน ที่รวมอยู่ในที่เดียว เต็มไปด้วยผู้คนที่กระตือรือร้นที่จะพูดคุยกับคุณ 🚀

    **พร้อมที่จะเริ่มสร้างสะพานใหม่กับเราหรือยัง?**
    {dot} **เพิ่งเคยมาใช่ไหม?** คำสั่ง `/setup` มีคำแนะนำทีละขั้นตอนเพื่อช่วยให้คุณเริ่มต้นการเดินทาง
    {dot} **พร้อมที่จะสำรวจ?** เยี่ยมชม [หน้าสำรวจ](https://interchat.dev/hubs) เพื่อค้นหาและเป็นส่วนหนึ่งของ Hubs ที่มีชีวิตชีวาของเรา

    💝 **หลงทาง? ต้องการความช่วยเหลือ?** เราขอเชิญคุณเข้าร่วม [ชุมชนสนับสนุน](https://discord.gg/8DhUA4HNpD) ทีมงานและชุมชนของเรายินดีที่จะให้ความช่วยเหลือ เราพร้อมสนับสนุนในทุกปัญหาที่คุณอาจพบ อย่าลังเลที่จะเข้าร่วม!
