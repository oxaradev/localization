about:
  title: InterChat के बारे में
  description: InterChat connects Discord communities through active cross-server discussions. Messages flow naturally between servers in real-time.
  supportText: मदद चाहिए? सहायता के लिए हमारे सपोर्ट सर्वर से जुड़ें!
  features:
    title: विशेषताएं
    list: |
      - Connect with other servers for active cross-server discussions
      - Messages flow naturally between servers in real-time
      - Build engaged topic-focused communities
      - Moderation tools to keep discussions healthy
      - Visual dashboard to manage your hubs, servers, and settings
  gettingStarted:
    title: Getting Started
    steps: |
      - Run `/setup` to get connected
      - Browse public hubs with `/hub discover`
      - Join a hub in a channel with `/connection add hub:<name>`
      - Join a private hub with `/connection add invite:<code>`
  buttons:
    shardInfo: Shard इन्फो
botLanding:
  title: '👋 नमस्ते!'
  description: |
    **I'm InterChat, and I'm pleased to be on your server.**

    Ready to start building new bridges?

    {dot} **New here?** The `/setup` command provides a step-by-step guide.
    {dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs).
  hubs: |
    ## {emoji} Hubs
    Multi-Server, always on connections. You can connect your channel to across server group (hubs) from our list of growing community hubs, and chat away with amazing people inside!
  calls: |
    ## {emoji} Calls (BETA)
    Private, one-on-one instant connections. Privacy-first by design, conversations stay private unless reported.
    -# PS. Beta phase. If you're here early, you're shaping the future of it. Early adopters may also get rewards
  closing: |
    Plug into a Hub. Launch a Call. Turn your server into something bigger than itself.

    Built by humans, for humans.
    —Oxara Development
setup:
  welcome:
    title: InterChat सेटअप में आपका स्वागत है
    description: आइए आपके सर्वर को कनेक्ट करें। यह विजार्ड आपको Hub बनाने या उसमें शामिल होने के माध्यम से मार्गदर्शन करेगा।
  select:
    placeholder: एक भाषा चुनें
  locale:
    successDescription: "{tick} आपकी भाषा **{locale_name}** पर सेट कर दी गई है"
  join:
    title: एक Hub में शामिल हों
    description: सार्वजनिक निर्देशिका का उपयोग करें या एक आमंत्रण कोड के साथ जुड़ें।
    publicHubs:
      title: सार्वजनिक (Public) Hubs
      description: "**Browse** [interchat.dev/hubs](https://interchat.dev/hubs)"
    privateHubs:
      title: निजी या केवल-आमंत्रण (Invite-only)
      description: "**Ask the hub owner** for an invite code or run `/connection add`"
    connectChannel:
      title: Connect a Channel
      description: "Run `/connection add` in the channel you want to use, then choose a hub.\n\nExamples:\n- `/connection add hub:MyHub`\n- `/connection add invite:abc123 channel:#general`"
      permissionsHint: "Requires **Manage Channels** (you) and **Manage Webhooks** + **Send Messages** (me in the target channel)."
    footer: You can join more hubs anytime.
  buttons:
    getStarted: सेटअप विजार्ड शुरू करें
    connectHere: Connect Here
    createHub: Hub बनाएं
    discoverHubs: सार्वजनिक Hubs खोजें
    useDefault: डिफ़ॉल्ट का उपयोग करें
