  description: InterChat चुनने के लिए धन्यवाद। मदद चाहिए? हमारे सपोर्ट सर्वर से जुड़ें। हमारे बॉट को अपने सर्वर पर आमंत्रित करने और सर्वरों को कनेक्ट करना शुरू करने के लिए नीचे दिए गए बटन का उपयोग करें।
services:
  hub:
    validation:
      invalidName: The provided hub name is invalid or contains disallowed characters.
      nameTaken: That hub name is already taken (names are case-insensitive). Please choose another.
    defaults:
      noDescription: No description provided.
  moderation:
    defaults:
      noReason: No reason provided.
badges:
  developer:
    title: InterChat Developer
    description: Core developer of InterChat
  staff:
    title: InterChat Staff
    description: InterChat staff member
  owner:
    title: Hub Owner
    description: Owner of the hub "{hubName}"
  moderator:
    title: Hub Moderator
    description: Moderator of the hub "{hubName}"
  manager:
    title: Hub Manager
    description: Manager of the hub "{hubName}"
broadcast:
  spam:
    mutedMessage: You have been temporarily muted for {minutes} minutes due to spam. Your mute expires at <t:{expiry}:F>.
    warningMessage: '⚠️ You are sending messages too quickly! Please slow down or you will be temporarily muted.'
    autoMuteReason: "Auto-Mute: Spam detected - exceeded {max} messages in {period} seconds"
    autoWarnReason: "Auto-Warn: Spam detected - exceeded {max} messages in {period} seconds"
  validation:
    accountAge:
      message: Your account is too new to send messages through InterChat. Please wait a few more days and try again.
      reason: Account too new
    hubLock:
      message: This hub is currently locked.
      reason: Hub is currently locked
    invites:
      message: "🚫 Discord invite links are not allowed in this hub."
    nsfw:
      message: "🚫 Your message was blocked by InterChat filters (Reason: NSFW detection)"
    profanity:
      message: '🚫 Your message was blocked by the hub''s profanity filter.'
      reason: Profanity filter blocked message
    videos:
      message: '🚫 Video attachments are not allowed in this hub.'
    messageLength:
      reason: Message Length
      message: Your message length is too long. Please shorten it.
    spam:
      reason: Spam detected
    accessRestriction:
      prefix: "Access restricted: "
      reason: Active restriction
blacklist:
  add:
    title: Add to Blocklist
    type:
      label: Type
      description: Specify whether you are blocking a User or a Server.
      options:
        userDesc: Block a specific user.
        serverDesc: Block an entire server.
    id:
      label: User or Server ID to Block
      placeholder: Enter the User ID or Server ID you wish to block
    reason:
      label: Note (optional)
      description: A small note helps you remember why you've blocked.
      placeholder: E.g., Spammer, Annoying, Toxic etc.
    messages:
      success: "Blocked {id} with reason: {reason}"
    errors:
      selfBlock: "{cross} You cannot block this server itself."
      selfUserBlock: "{cross} You cannot block yourself."
      failed: "Failed to block {id}. They might already be blocked."
  list:
    filters:
      all: "All ({count})"
      users: Users
      servers: Servers
    empty:
      all: "You're too nice! Block some servers/users to see them here."
      users: "No blocked users found."
      servers: "No blocked servers found."
    instructions: "You can add servers or users to the blocklist using the \"Add to Blocklist\"\nbutton in the previous message."
    errors:
      notFound: "{cross} Item not found or already removed."
      removeFailed: "{cross} Error removing item: {error}"
commands:
  suggestion:
    title: Suggestion / Bug Report
    overview:
      label: Overview
      placeholder: Briefly describe your suggestion or bug...
    description:
      label: विवरण
      placeholder: Provide full details of your suggestion or bug...
    category:
      label: Category
      options:
        bug: Bug Report
        bugDesc: Report an issue you've found
        suggestion: Suggestion
        suggestionDesc: Suggest a new feature or improvement
    errorId:
      label: Error ID (if applicable)
      placeholder: Paste the error ID here...
    messages:
      submitted: Your feedback has been received and will be reviewed by the team.
      success: "{tick} Thank you for your feedback! It has been submitted successfully."
    errors:
      internal: An error occurred while submitting your feedback. Please try again.
  report:
    title: रिपोर्ट कैसे करें
    description: "Right-click (or long press) on a message sent through InterChat and select **Apps → Report**."
    loadingGif: The GIF above may take a moment to load.
