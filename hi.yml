  about:
    title: "InterChat के बारे में"
    description: "InterChat सक्रिय क्रॉस-सर्वर चर्चाओं के माध्यम से Discord समुदायों को जोड़ता है। संदेश वास्तविक समय (real-time) में सर्वरों के बीच स्वाभाविक रूप से प्रवाहित होते हैं, जिससे आपको जुड़े हुए विषय-केंद्रित समुदाय बनाने में मदद मिलती है।"
    supportText: "मदद चाहिए? सहायता के लिए हमारे सपोर्ट सर्वर से जुड़ें!"
    features:
      title: "विशेषताएं"
      list: |
        - सक्रिय क्रॉस-सर्वर चर्चाओं के लिए अन्य सर्वरों के साथ जुड़ें
        - संदेश वास्तविक समय में सर्वरों के बीच स्वाभाविक रूप से प्रवाहित होते हैं
        - जुड़े हुए विषय-केंद्रित समुदाय बनाएं
        - चर्चाओं को स्वस्थ रखने के लिए मॉडरेशन टूल्स
        - अपने Hubs, सर्वरों और सेटिंग्स को प्रबंधित करने के लिए विज़ुअल डैशबोर्ड
    buttons:
      vote: "top.gg पर वोट करें"
      invite: "InterChat को आमंत्रित करें"
      dashboard: "डैशबोर्ड खोलें"
      support: "Support से जुड़ें"
      shardInfo: "Shard इन्फो"

  # Bot Greeting (New Server Join)
  botLanding:
    title: "👋 नमस्ते!"
    description: |
      **मैं InterChat हूँ, और मुझे हमारी टीम की ओर से आपके सर्वर पर होने की खुशी है।**
      साथ में, हम आपके सर्वर को पूरे Discord के अन्य शानदार समुदायों के साथ जोड़ सकते हैं। एक ही स्थान पर स्थित कई, संभावित रूप से हजारों सर्वर, सभी ऐसे व्यक्तियों से भरे हुए हैं जो आपके साथ बातचीत में शामिल होने के लिए उत्सुक हैं। 🚀

      **हमारे साथ नए पुल बनाने के लिए तैयार हैं?**
      {dot} **यहाँ नए हैं?** `/setup` कमांड आपको अपनी यात्रा शुरू करने में मदद करने के लिए एक चरण-दर-चरण गाइड प्रदान करता है।
      {dot} **एक्सप्लोर करने के लिए तैयार हैं?** हमारे जीवंत Hubs को खोजने और उसका हिस्सा बनने के लिए हमारे [discovery page](https://interchat.dev/hubs) पर जाएं।

      💝 **खो गए हैं? सहायता चाहिए?** हम हमारे [support community](https://discord.gg/8DhUA4HNpD) में आपका स्वागत करते हैं। हमारी टीम और हमारा समुदाय अपनी मदद देने में प्रसन्न होगा। आपको जो भी समस्याएं हो सकती हैं, हम उनमें अधिक से अधिक सहायता और समर्थन प्रदान करते हैं, शामिल होने में संकोच न करें!

