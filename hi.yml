about:
  title: InterChat के बारे में
  description: InterChat सक्रिय क्रॉस-सर्वर चर्चाओं के माध्यम से Discord समुदायों को जोड़ता है। संदेश वास्तविक समय (real-time) में सर्वरों के बीच स्वाभाविक रूप से प्रवाहित होते हैं, जिससे आपको जुड़े हुए विषय-केंद्रित समुदाय बनाने में मदद मिलती है।
  supportText: मदद चाहिए? सहायता के लिए हमारे सपोर्ट सर्वर से जुड़ें!
  features:
    title: विशेषताएं
    list: |
      - Connect with other servers for active cross-server discussions
      - Messages flow naturally between servers in real-time
      - Build engaged topic-focused communities
      - Moderation tools to keep discussions healthy
      - Visual dashboard to manage your hubs, servers, and settings
  buttons:
    shardInfo: Shard इन्फो
botLanding:
  title: '👋 नमस्ते!'
  description: "**I'm InterChat, and I'm pleased to be on your server on behalf of our team.** Together, we can connect your server with other remarkable communities from across Discord. Numerous, potentially thousands of servers located in one place, all filled with individuals eager to engage in conversation with you. 🚀 **Ready to start building new bridges with us?** {dot} **New here?** The `/setup` command provides a step-by-step guide to help you begin your journey. {dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs) to locate and become part of our lively hubs. 💝 **Lost? Require assistance?** We welcome you to our [support community](https://discord.gg/8DhUA4HNpD). Our team and our community will be pleased to offer their help. We offer as much support and assistance in whatever issues you may have, don't hesitate to join! "
setup:
  welcome:
    title: InterChat सेटअप में आपका स्वागत है
    description: आइए आपके सर्वर को कनेक्ट करें। यह विजार्ड आपको Hub बनाने या उसमें शामिल होने के माध्यम से मार्गदर्शन करेगा।
  select:
    placeholder: एक भाषा चुनें
  locale:
    successDescription: "{tick} आपकी भाषा **{locale_name}** पर सेट कर दी गई है"
  join:
    title: एक Hub में शामिल हों
    description: सार्वजनिक निर्देशिका का उपयोग करें या एक आमंत्रण कोड के साथ जुड़ें।
    publicHubs:
      title: सार्वजनिक (Public) Hubs
      description: "**Browse** [interchat.dev/hubs](https://interchat.dev/hubs) **Or click** the button below to open the directory"
    privateHubs:
      title: निजी या केवल-आमंत्रण (Invite-only)
      description: "**Ask the hub owner or manager** for an invite code **Run `/connection add <invite-code>`** in your server to join"
    footer: आप कभी भी और Hubs में शामिल हो सकते हैं, और आप अलग-अलग चैनलों में एक साथ कई Hubs से जुड़ सकते हैं।
