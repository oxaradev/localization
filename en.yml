about:
  title: About InterChat
  description:
    InterChat connects Discord communities through active cross-server
    discussions. Messages flow naturally between servers in real-time.
  supportText: Need help? Join our support server for assistance!
  features:
    title: Features
    list: |
      - Connect with other servers for active cross-server discussions
      - Messages flow naturally between servers in real-time
      - Build engaged topic-focused communities
      - Moderation tools to keep discussions healthy
      - Visual dashboard to manage your hubs, servers, and settings
  gettingStarted:
    title: Getting Started
    steps: |
      - Run `/setup` to get connected
      - Browse public hubs with `/hub directory`
      - Join a hub in a channel with `/hub connect hub:<name>`
      - Join a private hub with `/hub connect invite:<code>`
  buttons:
    shardInfo: Shard Info

botLanding:
  title: Welcome to InterChat! 🌐
  description: |
    Thank you for inviting InterChat. You now have 13,000+ Discord servers worldwide to chat with at your fingertips!
    ## What is InterChat?

    InterChat is the largest cross-server communication bot on Discord. Chat with people from thousands of communities, without anyone leaving their server. We offer two ways to connect:
  hubs: |
    ## ⭐ Hubs — Always-On Communities
    Connect a channel to a Hub and chat with 10+ servers at once. The connection stays active 24/7, creating a persistent portal between communities.

    ✦ Strict 24/7 moderation
    ✦ Active topic-based channels
    ✦ Best for long-term engagement

    Use `/hub connect` to get started
  calls: |
     ## 📞 Calls & Group Calls — Instant Cross-Server Calls
      Start a live conversation with up to 5 servers simultaneously. No invites, no setup. Instant connection.

      ✦ 1:1 Calls
      ✦ Group calls with up to 4 servers per call
      ✦ Built-in moderation tools
      ✦ Perfect for events & quick chats

      Use `/call` to get started
  closing: |
    ## Trusted by communities across Discord
    InterChat powers real-time conversations across 13,000+ servers. Join the network and connect with communities worldwide!

    -# Made with ❤️ by the InterChat Team

