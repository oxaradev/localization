about:
  title: About InterChat
  description: InterChat connects Discord communities through active cross-server
    discussions. Messages flow naturally between servers in real-time, helping you
    build engaged topic-focused communities.
  supportText: Need help? Join our support server for assistance!
  features:
    title: Features
    list: '- Connect with other servers for active cross-server discussions

      - Messages flow naturally between servers in real-time

      - Build engaged topic-focused communities

      - Moderation tools to keep discussions healthy

      - Visual dashboard to manage your hubs, servers, and settings

      '
  buttons:
    shardInfo: Shard Info
botLanding:
  title: 👋 Hey there!
  description: '**I''m InterChat, and I''m pleased to be on your server on behalf
    of our team.**

    Together, we can connect your server with other remarkable communities from across
    Discord. Numerous, potentially thousands of servers located in one place, all
    filled with individuals eager to engage in conversation with you. 🚀


    **Ready to start building new bridges with us?**

    {dot} **New here?** The `/setup` command provides a step-by-step guide to help
    you begin your journey.

    {dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs)
    to locate and become part of our lively hubs.


    💝 **Lost? Require assistance?** We welcome you to our [support community](https://discord.gg/8DhUA4HNpD).
    Our team and our community will be pleased to offer their help. We offer as much
    support and assistance in whatever issues you may have, don''t hesitate to join!

    '
setup:
  welcome:
    title: Welcome to InterChat Setup
    description: Let's get your server connected. This wizard will guide you through
      creating or joining a hub.
  select:
    placeholder: Select a language
  locale:
    successDescription: '{tick} Your language has been set to **{locale_name}**'
  join:
    title: Join a Hub
    description: Use the public directory or connect with an invite code.
    publicHubs:
      title: Public Hubs
      description: '**Browse** [interchat.dev/hubs](https://interchat.dev/hubs)

        **Or click** the button below to open the directory'
    privateHubs:
      title: Private or Invite-only
      description: '**Ask the hub owner or manager** for an invite code

        **Run `/connection add <invite-code>`** in your server to join'
    footer: You can join more hubs anytime, and you can be connected to multiple hubs
      at once in different channels.
  buttons:
    startWizard: Start Setup Wizard
    createHub: Create Hub
    discoverHubs: Discover Public Hubs
    joinHub: Join Hub
    useDefault: Use Default
    skipForNow: Skip for Now
