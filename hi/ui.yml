  about:
    title: InterChat के बारे में
    description: InterChat Discord समुदायों को सक्रिय क्रॉस-सर्वर चर्चाओं के माध्यम से जोड़ता है। संदेश सर्वरों के बीच वास्तविक
      समय में स्वाभाविक रूप से प्रवाहित होते हैं, जिससे आपको सक्रिय और विषय-केंद्रित समुदाय बनाने में मदद मिलती है।
    supportText: मदद चाहिए? सहायता के लिए हमारे सपोर्ट सर्वर से जुड़ें!
    features:
      title: विशेषताएँ
      list: '- सक्रिय क्रॉस-सर्वर चर्चाओं के लिए अन्य सर्वरों से जुड़ें

        - संदेश सर्वरों के बीच वास्तविक समय में स्वाभाविक रूप से प्रवाहित होते हैं

        - सक्रिय और विषय-केंद्रित समुदाय बनाएं

        - चर्चाओं को स्वस्थ बनाए रखने के लिए संयम उपकरण

        - अपने हब, सर्वर और सेटिंग्स को प्रबंधित करने के लिए दृश्य डैशबोर्ड

        '
    buttons:
      vote: top.gg पर वोट करें
      invite: InterChat को बुलाएँ
      dashboard: डैशबोर्ड खोलें
      support: सहायता सर्वर से जुड़ें
      shardInfo: Shard जानकारी
  botLanding:
    title: 👋 नमस्ते!
    description: '**मैं InterChat हूँ, और हमारी टीम की ओर से आपके सर्वर पर आने पर प्रसन्न हूँ।**

      हम साथ में आपके सर्वर को Discord के अन्य अद्भुत कम्युनिटीज़ से जोड़ सकते हैं। यहाँ एक जगह में कई, संभावित रूप से हजारों
      सर्वर, सभी लोगों से भरे हुए हैं जो आपसे बातचीत करने के लिए उत्सुक हैं। 🚀


      **हमारे साथ नए रास्ते बनाने के लिए तैयार?**

      {dot} **यहाँ नए हैं?** `/setup` कमांड स्टेप-बाय-स्टेप मार्गदर्शन प्रदान करता है।

      {dot} **खोज शुरू करने के लिए तैयार?** हमारे [डिस्कवरी पेज](https://interchat.dev/hubs) पर जाएँ।

      {dot} **कुछ और परिचित लगता है?** एक-से-एक कनेक्शन के लिए `/call` का प्रयास करें।


      💝 **खो गए? सहायता चाहिए?** हमारे [सपोर्ट कम्युनिटी](https://discord.gg/8DhUA4HNpD) में आपका स्वागत है। हमारी टीम और
      समुदाय आपकी सहायता के लिए तैयार हैं।

      '
