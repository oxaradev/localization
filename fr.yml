about:
  title: "A propose de InterChat"
  description: "."
  supportText: "Besoin d'aide ? Rejoignez notre serveur d'assistance !"
  features:
    title: "Caractéristiques"
    list: |
      - Connectez-vous à d'autres serveurs pour des discussions actives entre serveurs - Les messages circulent naturellement entre les serveurs en temps réel - Créez des communautés engagées et axées sur un sujet - Outils de modération pour des discussions dynamiques - Tableau de bord visuel pour gérer vos hubs, serveurs et paramètres 
  buttons:
    vote: "Voter sur top.gg"
    invite: "Inviter InterChat"
    dashboard: "Ouvrez les tableaux de bord"
    support: "Rejoignez le support"
    shardInfo: "Info partagée"
botLanding:
  title: "👋 Hey there!"
  description: |
    **I'm InterChat, and I'm pleased to be on your server on behalf of our team.** Together, we can connect your server with other remarkable communities from across Discord. Numerous, potentially thousands of servers located in one place, all filled with individuals eager to engage in conversation with you. 🚀 **Ready to start building new bridges with us?** {dot} **New here?** The `/setup` command provides a step-by-step guide to help you begin your journey. {dot} **Ready to explore?** Visit our [discovery page](https://interchat.dev/hubs) to locate and become part of our lively hubs. {dot} **Perhaps something you're more familiar with?** Try our `/call` for one on one connections. 💝 **Lost? Require assistance?** We welcome you to our [support community](https://discord.gg/8DhUA4HNpD). Our team and our community will be pleased to offer their help. We offer as much support and assistance in whatever issues you may have, don't hesitate to join! 
