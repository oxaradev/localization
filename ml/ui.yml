          **ചേരാൻ നിങ്ങളുടെ സെർവറിൽ `/connection add <invite-code>`** റൺ ചെയ്യുക"
      footer:
        നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും കൂടുതൽ ഹബ്ബുകളിൽ ചേരാം, വ്യത്യസ്ത ചാനലുകളിലായി ഒരേസമയം ഒന്നിലധികം ഹബ്ബുകളിലേക്ക്
        കണക്റ്റുചെയ്യാനും കഴിയും.
