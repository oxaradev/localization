        **{locale_name}**"
    loading:
      creatingHub: "{loading} നിങ്ങളുടെ ഹബ് സൃഷ്‌ടിക്കുന്നു..."
      pleaseWait: നിങ്ങളുടെ കമ്മ്യൂണിറ്റി സ്ഥലം ഞങ്ങൾ സജ്ജീകരിക്കുന്നതുവരെ കാത്തിരിക്കുക.
    create:
      footer:
        getStarted: Click 'Enter Hub Information' below to get started!
      whatYoullCreate:
        title: "നിങ്ങൾ സൃഷ്ടിക്കുന്നത്:"
        description:
          "{dot} നിങ്ങളുടെ സെർവറുകൾക്കായി ഒരു അദ്വിതീയ കമ്മ്യൂണിറ്റി ഇടം

          {dot} നിയമങ്ങളിലും മോഡറേഷനിലും പൂർണ്ണ നിയന്ത്രണം

          {dot} ഇഷ്ടാനുസൃത ക്രമീകരണങ്ങളും സവിശേഷതകളും

          {dot} സ്ഥിരസ്ഥിതിയായി സ്വകാര്യം - ക്ഷണം മാത്രം"
      youllNeed:
