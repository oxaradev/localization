      shardInfo: ഷാർഡ് വിവരം
  botLanding:
    title: 👋 ഹേയ്!
    description:
      "**ഞാൻ ഇന്റർചാറ്റ് ആണ്, ഞങ്ങളുടെ ടീമിനുവേണ്ടി നിങ്ങളുടെ സെർവറിൽ ഉണ്ടായിരിക്കുന്നതിൽ എനിക്ക് സന്തോഷമുണ്ട്.**

      ഒന്നിച്ചുചേർന്ന്, ഡിസ്‌കോർഡിൽ ഉടനീളമുള്ള മറ്റ് ശ്രദ്ധേയമായ കമ്മ്യൂണിറ്റികളുമായി നിങ്ങളുടെ സെർവറിനെ ബന്ധിപ്പിക്കാൻ ഞങ്ങൾക്ക്
      കഴിയും. നിങ്ങളുമായി സംഭാഷണത്തിൽ ഏർപ്പെടാൻ ആഗ്രഹിക്കുന്ന വ്യക്തികളാൽ നിറഞ്ഞിരിക്കുന്ന നിരവധി, ആയിരക്കണക്കിന് സെർവറുകൾ
      ഒരിടത്ത് സ്ഥിതിചെയ്യുന്നു. 🚀


      **ഞങ്ങളുമായി പുതിയ പാലങ്ങൾ നിർമ്മിക്കാൻ തയ്യാറാണോ?**

      {dot} **ഇവിടെ പുതിയയാളാണോ?** `/setup` കമാൻഡ് നിങ്ങളുടെ യാത്ര ആരംഭിക്കാൻ നിങ്ങളെ സഹായിക്കുന്നതിന് ഒരു ഘട്ടം ഘട്ടമായുള്ള
      ഗൈഡ് നൽകുന്നു.

      {dot} **പര്യവേക്ഷണം ചെയ്യാൻ തയ്യാറാണോ?** ഞങ്ങളുടെ [കണ്ടെത്തൽ പേജ്](https://interchat.dev/hubs) സന്ദർശിക്കുക, ഞങ്ങളുടെ
      സജീവമായ ഹബ്ബുകൾ കണ്ടെത്താനും അവയുടെ ഭാഗമാകാനും.

      {dot} **ഒരുപക്ഷേ നിങ്ങൾക്ക് കൂടുതൽ പരിചിതമായ എന്തെങ്കിലും?** വൺ ഓൺ വൺ കണക്ഷനുകൾക്കായി ഞങ്ങളുടെ `/call` പരീക്ഷിക്കുക.


      💝 **നഷ്ടപ്പെട്ടോ? സഹായം ആവശ്യമുണ്ടോ?** ഞങ്ങളുടെ [പിന്തുണ കമ്മ്യൂണിറ്റി](https://discord.gg/8DhUA4HNpD) ലേക്ക് ഞങ്ങൾ
      നിങ്ങളെ സ്വാഗതം ചെയ്യുന്നു. ഞങ്ങളുടെ ടീമും സമൂഹവും സഹായം വാഗ്ദാനം ചെയ്യുന്നതിൽ സന്തോഷിക്കും. നിങ്ങൾക്ക് എന്ത് പ്രശ്‌നങ്ങളുണ്ടെങ്കിലും,
      മടിക്കാതെ ചേരൂ!

      "
  setup:
