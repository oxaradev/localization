      publicHubs:
        title: പൊതു കേന്ദ്രങ്ങൾ
        description:
          "**ബ്രൗസ്** [interchat.tech/hubs](https://interchat.dev/hubs)

          **അല്ലെങ്കിൽ ഡയറക്ടറി തുറക്കാൻ താഴെയുള്ള ബട്ടൺ ക്ലിക്ക് ചെയ്യുക**"
      privateHubs:
        title: സ്വകാര്യം അല്ലെങ്കിൽ ക്ഷണം മാത്രം
