commands:
  about:
    title: "ഇൻ്റർചാറ്റിനെക്കുറിച്ച്"
    description_text: "ഇന്റർചാറ്റ് സജീവമായ ക്രോസ്-സെർവർ ചർച്ചകളിലൂടെ ഡിസ്‌കോർഡ് കമ്മ്യൂണിറ്റികളെ ബന്ധിപ്പിക്കുന്നു. സന്ദേശങ്ങൾ തത്സമയം സെർവറുകൾക്കിടയിൽ സ്വാഭാവികമായി ഒഴുകുന്നു, ഇത് ഇടപഴകുന്ന വിഷയാധിഷ്ഠിത കമ്മ്യൂണിറ്റികൾ നിർമ്മിക്കാൻ നിങ്ങളെ സഹായിക്കുന്നു."
    support_text: "സഹായം ആവശ്യമുണ്ടോ? സഹായത്തിനായി ഞങ്ങളുടെ പിന്തുണ സെർവറിൽ ചേരൂ!"
    features:
      title: "ഫീച്ചറുകൾ"
      list: |
        - സജീവമായ ക്രോസ്-സെർവർ ചർച്ചകൾക്കായി മറ്റ് സെർവറുകളുമായി കണക്റ്റുചെയ്യുക
        - സന്ദേശങ്ങൾ തത്സമയം സെർവറുകൾക്കിടയിൽ സ്വാഭാവികമായി ഒഴുകുന്നു
        - ഇടപഴകുന്ന വിഷയാധിഷ്ഠിത കമ്മ്യൂണിറ്റികൾ നിർമ്മിക്കുക
        - ചർച്ചകൾ ആരോഗ്യകരമായി നിലനിർത്തുന്നതിനുള്ള മോഡറേഷൻ ഉപകരണങ്ങൾ
        - നിങ്ങളുടെ ഹബുകൾ, സെർവറുകൾ, ക്രമീകരണങ്ങൾ എന്നിവ കൈകാര്യം ചെയ്യുന്നതിനുള്ള വിഷ്വൽ ഡാഷ്‌ബോർഡ്
    buttons:
      vote: "Top.gg-ൽ വോട്ട് ചെയ്യുക"
      invite: "ഇൻ്റർചാറ്റിനെ ക്ഷണിക്കുക"
      dashboard: "ഡാഷ്‌ബോർഡ് തുറക്കുക"
      support: "പിന്തുണയിൽ ചേരുക"
      shardInfo: "ഷാർഡ് വിവരം"
  setup:
    welcome:
      title: "ഇന്റർചാറ്റ് സജ്ജീകരണത്തിലേക്ക് സ്വാഗതം"
      description: "നിങ്ങളുടെ സെർവറുമായി ബന്ധിപ്പിക്കാം. ഒരു ഹബ് സൃഷ്ടിക്കുന്നതിനോ ചേരുന്നതിനോ ഈ വിസാർഡ് നിങ്ങളെ നയിക്കും."
    options:
      create:
        label: "ഒരു ഹബ് സൃഷ്ടിക്കുക"
        description: "നിങ്ങളുടെ സ്വന്തം ഇന്റർചാറ്റ് കമ്മ്യൂണിറ്റി ആരംഭിക്കുക"
      join:
        label: "ഒരു ഹബ്ബിൽ ചേരുക"
        description: "നിലവിലുള്ള ഒരു കമ്മ്യൂണിറ്റിയിലേക്ക് കണക്റ്റുചെയ്യുക"
    create:
      whatYoullCreate:
        title: "നിങ്ങൾ സൃഷ്ടിക്കുന്നത്:"
        description: "{dot} നിങ്ങളുടെ സെർവറുകൾക്കായി ഒരു അദ്വിതീയ കമ്മ്യൂണിറ്റി ഇടം\n{dot} നിയമങ്ങളിലും മോഡറേഷനിലും പൂർണ്ണ നിയന്ത്രണം\n{dot} ഇഷ്ടാനുസൃത ക്രമീകരണങ്ങളും സവിശേഷതകളും\n{dot} സ്ഥിരസ്ഥിതിയായി സ്വകാര്യം - ക്ഷണം മാത്രം"
      youllNeed:
        title: "നിങ്ങൾക്ക് ഇത് ആവശ്യമാണ്:"
        description: "{arrow_right} ക്രിയേറ്റീവ് ഹബ് നാമം\n{arrow_right} സംക്ഷിപ്ത വിവരണം\n{arrow_right} വിശദമായ വിവരണം\n{arrow_right} ലോഗോ ഇമേജ് URL"
    join:
      title: "ഒരു ഹബ്ബിൽ ചേരുക"
      description: "പബ്ലിക് ഡയറക്ടറി ഉപയോഗിക്കുകയോ ഒരു ക്ഷണ കോഡ് ഉപയോഗിച്ച് ബന്ധിപ്പിക്കുകയോ ചെയ്യുക."
      publicHubs:
        title: "പൊതു കേന്ദ്രങ്ങൾ"
        description: "**ബ്രൗസ്** [interchat.tech/hubs](https://interchat.dev/hubs)\n**അല്ലെങ്കിൽ ഡയറക്ടറി തുറക്കാൻ താഴെയുള്ള ബട്ടൺ ക്ലിക്ക് ചെയ്യുക**"
      privateHubs:
        title: "സ്വകാര്യം അല്ലെങ്കിൽ ക്ഷണം മാത്രം"
        description: "**ഹബ് ഉടമയോടോ മാനേജരോടോ ഒരു ക്ഷണ കോഡ് ചോദിക്കുക**\n**ചേരാൻ നിങ്ങളുടെ സെർവറിൽ `/connection add <invite-code>`** റൺ ചെയ്യുക"
      footer: "നിങ്ങൾക്ക് എപ്പോൾ വേണമെങ്കിലും കൂടുതൽ ഹബ്ബുകളിൽ ചേരാം, വ്യത്യസ്ത ചാനലുകളിലായി ഒരേസമയം ഒന്നിലധികം ഹബ്ബുകളിലേക്ക് കണക്റ്റുചെയ്യാനും കഴിയും."
    nextSteps:
      created:
        title: "ഹബ് വിജയകരമായി സൃഷ്ടിച്ചു!"
        description: |
          നിങ്ങളുടെ ഹബ് **{hubName}** തയ്യാറാണ്! അടുത്തതായി നിങ്ങൾക്ക് ചെയ്യാൻ കഴിയുന്നത് ഇതാ:
          - `/invite` ഉപയോഗിച്ച് നിങ്ങളുടെ ആദ്യ സെർവറിനെ ക്ഷണിക്കുക
          - `/rules set` ഉപയോഗിച്ച് നിയമങ്ങൾ സജ്ജമാക്കുക
          - [ഡാഷ്‌ബോർഡ്](https://interchat.dev/dashboard)-ൽ ക്രമീകരണങ്ങൾ ഇഷ്ടാനുസൃതമാക്കുക
          - `/connection add <hub-name>` ഉപയോഗിച്ച് ചാനലുകൾ ബന്ധിപ്പിക്കുക
        inviteLink:
          title: "അടുത്തത്: ക്ഷണ ലിങ്കുകൾ സൃഷ്ടിക്കുക"
          description: "**{hubName}** എന്നതിനായുള്ള ക്ഷണ കോഡുകൾ സൃഷ്ടിക്കുന്നതിനും അവ മറ്റ് സെർവർ ഉടമകളുമായി പങ്കിടുന്നതിനും {hubInviteCommand} ഉപയോഗിക്കുക."
        shareHub:
          title: "നിങ്ങളുടെ ഹബ് പങ്കിടുക"
          description: "{dot} നിങ്ങളുടെ പുതിയ ഹബ്ബിനെക്കുറിച്ച് ഞങ്ങളുടെ [സപ്പോർട്ട് സെർവറിൽ]({supportInvite}) പോസ്റ്റ് ചെയ്യുക\n{dot} സുഹൃത്തുക്കളുമായും കമ്മ്യൂണിറ്റികളുമായും പങ്കിടുക\n{dot} സോഷ്യൽ മീഡിയ ഉപയോഗിച്ച് വാർത്ത പ്രചരിപ്പിക്കുക"
        proTips:
          title: "{dot} പ്രൊഫഷണൽ ടിപ്പുകൾ"
          description: "{dot} വിപുലമായ ക്രമീകരണങ്ങൾക്കായി [ഡാഷ്‌ബോർഡ്]({website}) സന്ദർശിക്കുക\n{dot} നിങ്ങളുടെ ഹബ് പബ്ലിക് ആക്കാൻ {hubVisibilityCommand} ഉപയോഗിക്കുക\n{dot} സഹായത്തിനും അപ്‌ഡേറ്റുകൾക്കുമായി ഞങ്ങളുടെ [സപ്പോർട്ട് സെർവറിൽ]({supportInvite}) ചേരുക"
        footer: "സഹായം ആവശ്യമുണ്ടോ? ഞങ്ങളുടെ പിന്തുണ സെർവറിൽ ചേരുക."
  report:
    title: "റിപ്പോർട്ട് സന്ദേശം"
    footer: "ഇന്റർചാറ്റ് എല്ലാവർക്കും സുരക്ഷിതമായി നിലനിർത്താൻ റിപ്പോർട്ടുകൾ സഹായിക്കുന്നു"
    contextMenu: "റിപ്പോർട്ട് സന്ദേശം"
    description: "ഹബ് ലംഘനങ്ങൾക്ക് {user} നെ **ഹബ് സ്റ്റാഫിനോ** പ്ലാറ്റ്‌ഫോം ലംഘനങ്ങൾക്ക് **ഇന്റർചാറ്റ് സ്റ്റാഫിനോ** റിപ്പോർട്ട് ചെയ്യുക. ഉപയോക്താവിനെ അറിയിക്കില്ല, പക്ഷേ ആരാണ് റിപ്പോർട്ട് സമർപ്പിച്ചതെന്ന് മോഡറേറ്റർമാർക്ക് കാണാൻ കഴിയും."
    success:
      title: "റിപ്പോർട്ട് സമർപ്പിച്ചു"
      toStaff: "{tick} നിങ്ങളുടെ റിപ്പോർട്ട് ഇന്റർചാറ്റ് സ്റ്റാഫിന് അവലോകനത്തിനായി അയച്ചു."
      toHub: "{tick} നിങ്ങളുടെ റിപ്പോർട്ട് അവലോകനത്തിനായി ഹബ് മോഡറേറ്റർമാർക്ക് അയച്ചു."
    errors:
      hubMessageOnly: "{x_icon} ഇന്റർചാറ്റ് ഹബ്ബുകൾ വഴി മാത്രമേ നിങ്ങൾക്ക് സന്ദേശങ്ങൾ റിപ്പോർട്ട് ചെയ്യാൻ കഴിയൂ."
      cannotReportSelf: "{x_icon} നിങ്ങളുടെ സ്വന്തം സന്ദേശങ്ങൾ റിപ്പോർട്ട് ചെയ്യാൻ കഴിയില്ല."
  hubCreate:
    success:
      description: "നിങ്ങളുടെ ഹബ് **{hubName}** തയ്യാറാണ്! അടുത്തതായി നിങ്ങൾക്ക് ചെയ്യാൻ കഴിയുന്നത് ഇതാ:"
    errors:
      hubCreationFailed: "നിങ്ങളുടെ ഹബ് സൃഷ്ടിക്കുമ്പോൾ എന്തോ കുഴപ്പം സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക."
      troubleshooting: "നിങ്ങൾക്ക് എന്തുചെയ്യാൻ കഴിയും:"
      troubleshootingSteps: "• നിങ്ങളുടെ ലോഗോ URL സാധുതയുള്ളതാണോ എന്ന് പരിശോധിക്കുക\n• കുറച്ച് നിമിഷങ്ങൾക്കുള്ളിൽ വീണ്ടും ശ്രമിക്കുക\n• ഇത് തുടരുകയാണെങ്കിൽ പിന്തുണയുമായി ബന്ധപ്പെടുക"
  general:
    invite:
      title: "ഹേയ്!"
      description: "ഇന്റർചാറ്റ് തിരഞ്ഞെടുത്തതിന് നന്ദി. സഹായം ആവശ്യമുണ്ടോ? ഞങ്ങളുടെ പിന്തുണാ സെർവറിൽ ചേരുക. താഴെയുള്ള ബട്ടണുകൾ ഉപയോഗിച്ച് ഞങ്ങളുടെ ബോട്ടിനെ നിങ്ങളുടെ സെർവറിലേക്ക് ക്ഷണിച്ച് സെർവറുകളുമായി ബന്ധിപ്പിക്കാൻ ആരംഭിക്കുക."
  stats:
    title: "ഇന്റർചാറ്റ് മെട്രിക്സ്"
    shard:
      title: "ഷാർഡ് വിവരങ്ങൾ"
      statusReady: "തയ്യാറാണ്"
      statusProvisioning: "പ്രൊവിഷനിംഗ്..."
      current: "നിലവിലെ ഷാർഡ്: #{id}"
  help:
    title: "ഇന്റർചാറ്റ് കമാൻഡുകൾ"
    description: "നിങ്ങളെ സഹായിക്കുന്നതിനും നിങ്ങളുടെ കമ്മ്യൂണിറ്റി മറ്റുള്ളവരുമായി ബന്ധപ്പെടുന്നതിനും ഞങ്ങളുടെ വിശാലമായ കമാൻഡുകൾ പര്യവേക്ഷണം ചെയ്യുക."
    noDescription: "വിവരണമില്ല"
    name: "സഹായം"
  staff:
    blacklist:
      list:
        description: "ഉപയോക്താക്കളോ സെർവറുകളോ ഫിൽട്ടർ ചെയ്‌ത ബ്ലാക്ക്‌ലിസ്റ്റ് എൻട്രികൾ കാണുക"
    get:
      description: "ഇന്റർചാറ്റ് എന്റിറ്റികളെക്കുറിച്ചുള്ള വിവരങ്ങൾ നേടുക"
      server:
        description: "ഒരു സെർവറിനെക്കുറിച്ചുള്ള വിശദമായ വിവരങ്ങൾ നേടുക"
      hub:
        description: "ഒരു ഹബിനെക്കുറിച്ചുള്ള വിശദമായ വിവരങ്ങൾ നേടുക"
      user:
        description: "ഒരു ഉപയോക്താവിനെക്കുറിച്ചുള്ള വിശദമായ വിവരങ്ങൾ നേടുക"
  profile:
    achievements:
      noneFound: "ഒന്നും കണ്ടെത്തിയില്ല"
